[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tradex-trading"
version = "0.1.0"
description = "TradeX v4 trading platform — reactive execution engine, OMS, strategy, analytics, datalake, replay, SDK session"
requires-python = ">=3.12"
dependencies = [
    "tradex-domain>=0.1.0,<0.2",
    "tradex-brokers>=0.1.0,<0.2",
    "rx>=3.2,<4",
]

[project.optional-dependencies]
analytics = ["numpy>=1.26,<3"]
datalake = ["duckdb>=0.10,<2", "pandas>=2,<3", "pyarrow>=14,<20"]
# TestClient (fastapi.testclient) needs the real httpx at runtime; the
# previously-declared "httpx2" was an unrelated package nothing imports.
api = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1", "httpx>=0.27,<1", "websockets>=12,<18"]
full = ["numpy>=1.26,<3", "duckdb>=0.10,<2", "fastapi>=0.110,<1", "uvicorn>=0.29,<1", "httpx>=0.27,<1", "websockets>=12,<18"]

[project.scripts]
tradex = "tradex_trading.interface.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tradex_trading"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
mypy_path = "../domain/src:../brokers/src"
ignore_missing_imports = true
disable_error_code = ["no-any-return", "misc"]

[tool.pytest.ini_options]
# Self-contained pytest config: running ``python -m pytest`` from trading/
# must not silently depend on the repo-root conftest.py/pyproject.toml for
# package resolution (rootdir would otherwise walk up to v4/). Relative
# paths resolve against this rootdir, mirroring the mypy_path convention.
testpaths = ["tests"]
addopts = "--import-mode=importlib"
pythonpath = ["src", "../domain/src", "../brokers/src"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
