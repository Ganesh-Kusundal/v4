[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tradex-config"
version = "0.1.0"
description = "TradeX application configuration (AppConfig, env loader)"
requires-python = ">=3.12"

dependencies = [
    "tradex-domain>=0.1.0,<0.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tradex_config"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]
