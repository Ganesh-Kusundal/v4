[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tradex-research"
version = "0.1.0"
description = "TradeX research manifests and point-in-time validators"
requires-python = ">=3.12"
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/tradex_research"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]
