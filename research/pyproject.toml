[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tradex-research"
version = "0.1.0"
description = "TradeX research manifests and point-in-time validators"
requires-python = ">=3.12"
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/tradex_research"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# This block existed with no `select`, so research/ was the one tree in the repo
# linted under ruff's *defaults* rather than the E/F/W/I/UP set the root and the
# other packages declare — which is how DTZ/C4/RUF rules turned up in a gate
# documented as running E,F,W,I,UP. Declared explicitly to match the root.
select = ["E", "F", "W", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]
