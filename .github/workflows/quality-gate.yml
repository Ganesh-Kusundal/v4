name: quality-gate

# Quality gate: ruff lint + mypy (domain) + the unit-test suite. Runs
# alongside parity-gate on every push and PR, and can be triggered manually
# for verification.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./domain -e ./brokers -e ./trading ruff mypy "protobuf>=6.33,<7"
      - name: Ruff
        run: ruff check domain/src brokers/src trading/src
      - name: Mypy (domain)
        run: mypy domain/src/tradex_domain --ignore-missing-imports
      - name: Unit tests
        run: python -m pytest trading/tests/parity trading/tests/contracts trading/tests/execution/test_position_math.py -q
