name: quality-gate

# Quality gate: ruff lint + mypy (all packages) + full pytest suite with coverage.
# Runs on push to main/develop, on PRs, and can be triggered manually.
on:
  push:
    branches: ["main", "develop"]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # The workspace packages are uv workspace members whose manifests depend
      # on each other by name; plain `pip install -e ./domain -e ./brokers`
      # cannot resolve a sibling from this repo and dies looking for it on
      # PyPI. See parity.yml.
      - name: Install uv
        run: pip install uv

      - name: Sync dependencies
        run: uv sync --frozen

      # Every tool below runs through `uv run --no-sync`. `uv sync` creates
      # .venv/ but does not put .venv/bin on PATH, so a bare `ruff`/`mypy`/
      # `python` here resolves to the setup-python interpreter, which has none
      # of them installed. --no-sync keeps the frozen lock authoritative instead
      # of letting `uv run` silently re-resolve.
      #
      # Ratchet, not a hard wall. `ruff check` currently reports pre-existing
      # violations of the E/F/W/I/UP/C90/PLR0912/PLR0915/N/B/T20 set the root
      # pyproject declares. Clearing them all is a cleanup project; what the
      # gate must protect is that the number never grows. This step reads the
      # committed baseline in `.ruff_baseline` and fails only if the count went
      # UP, so the wall can only shrink. To lower the baseline on purpose after
      # a cleanup: `python scripts/ruff_ratchet.py --set-baseline`.
      #
      # This replaces the previous hard `ruff check` step, which could never go
      # green and therefore made every step below it (mypy, pytest) unreachable
      # on a runner — a gate that reports on style and never on behaviour.
      - name: Ruff ratchet (no new lint errors)
        run: uv run --no-sync python scripts/ruff_ratchet.py

      - name: Mypy (domain)
        run: uv run --no-sync mypy domain/src/tradex_domain

      # Every package hard-fails mypy under the root config's strict annotation
      # flags (disallow_untyped_defs, disallow_incomplete_defs, warn_return_any,
      # no_implicit_optional, check_untyped_defs, strict_optional). Packages
      # currently sit at non-zero error counts; each is promoted to the
      # zero-errors state by clearing its own debt, never by softening the
      # flags. The two Upstox depth subscriptions are resolved with documented
      # casts (the market backend is Upstox's depth backend at runtime, but
      # 30-level depth is provider-specific); the cleaner provider-specific
      # depth port is tracked in docs/specs/remediation-and-hardening.md.
      - name: Mypy (brokers)
        run: uv run --no-sync mypy brokers/src/tradex_brokers

      - name: Mypy (config)
        run: uv run --no-sync mypy config/src/tradex_config

      - name: Mypy (execution)
        run: uv run --no-sync mypy execution/src/tradex_execution

      - name: Mypy (analytics)
        run: uv run --no-sync mypy analytics/src/tradex_analytics

      - name: Mypy (strategy)
        run: uv run --no-sync mypy strategy/src/tradex_strategy

      - name: Mypy (interfaces)
        run: uv run --no-sync mypy interfaces/src/tradex_interfaces

      - name: Mypy (runtime)
        run: uv run --no-sync mypy runtime/src/tradex_runtime

      - name: Mypy (market_data)
        run: uv run --no-sync mypy market_data/src/tradex_market_data

      - name: Mypy (replay)
        run: uv run --no-sync mypy replay/src/tradex_replay

      - name: Mypy (reactive)
        run: uv run --no-sync mypy reactive/src/tradex_reactive

      - name: Mypy (observability)
        run: uv run --no-sync mypy observability/src/tradex_observability

      - name: Mypy (application)
        run: uv run --no-sync mypy application/src/tradex_application

      - name: Mypy (duckdb-analytics)
        run: uv run --no-sync mypy services/duckdb-analytics/src/duck_analytics

      - name: Import-linter (boundary contracts)
        run: uv run --no-sync --with import-linter lint-imports

      - name: Complexity gate
        run: uv run --no-sync python -m pytest tests/test_complexity_gate.py -q

      # Coverage names the importable packages, not the top-level
      # directories. The directory form (`--cov=trading`) matches no module and
      # coverage reported "No data to report" — so the step that looked like it
      # was measuring 9 packages was measuring none of them.
      #
      # Floor: 85. Measured on this tree: 88.2% (24374 statements, 2881 missed;
      # per-package range 79.7% tradex_trading to 100% in five packages). 85
      # leaves ~3 points — roughly 780 statements — of headroom for the
      # differences between this measurement and a runner's (CI is Python 3.12,
      # this venv is 3.13; platform-conditional tests skip differently), and
      # still fails on any regression larger than that. It is a floor, not a
      # target: raise it as coverage genuinely rises.
      - name: Pytest with coverage
        run: >-
          uv run --no-sync python -m pytest
          --cov=tradex_domain --cov=tradex_brokers --cov=tradex_config
          --cov=tradex_observability --cov=tradex_analytics
          --cov=tradex_reactive --cov=tradex_execution --cov=tradex_strategy
          --cov=tradex_replay --cov=tradex_application
          --cov=tradex_market_data --cov=tradex_interfaces
          --cov=tradex_runtime
          --cov-fail-under=85
          --cov-report=term-missing --cov-report=json:coverage.json -q

      - name: Per-package branch coverage floors
        run: uv run --no-sync python scripts/coverage_floors.py --json coverage.json
