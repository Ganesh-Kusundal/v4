name: quality-gate

# Quality gate: ruff lint + mypy (all packages) + full pytest suite with coverage.
# Runs on push to main/develop, on PRs, and can be triggered manually.
on:
  push:
    branches: ["main", "develop"]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install uv
        run: pip install uv

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: ruff check

      - name: Mypy (domain)
        run: mypy domain/src/tradex_domain

      - name: Mypy (brokers)
        run: mypy brokers/src/tradex_brokers

      - name: Mypy (config)
        continue-on-error: true  # hard-fail after typing debt cleared (B3 goal)
        run: mypy config/src/tradex_config

      - name: Mypy (execution)
        continue-on-error: true  # hard-fail after typing debt cleared (B3 goal)
        run: mypy execution/src/tradex_execution

      - name: Mypy (analytics)
        continue-on-error: true  # hard-fail after typing debt cleared (B3 goal)
        run: mypy analytics/src/tradex_analytics

      - name: Mypy (strategy)
        continue-on-error: true  # hard-fail after typing debt cleared (B3 goal)
        run: mypy strategy/src/tradex_strategy

      - name: Mypy (interfaces)
        continue-on-error: true  # hard-fail after typing debt cleared (B3 goal)
        run: mypy interfaces/src/tradex_interfaces

      - name: Mypy (runtime)
        continue-on-error: true  # hard-fail after typing debt cleared (B3 goal)
        run: mypy runtime/src/tradex_runtime

      - name: Mypy (trading)
        continue-on-error: true  # PE-3: incremental typing — shims/composition baseline
        run: mypy trading/src/tradex_trading

      - name: Pytest with coverage
        run: >-
          python -m pytest
          --cov=domain --cov=brokers --cov=trading
          --cov=execution --cov=analytics --cov=strategy
          --cov=interfaces --cov=runtime --cov=config
          --cov-report=term-missing -q
