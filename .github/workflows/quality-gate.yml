name: quality-gate

# Quality gate: ruff lint + mypy (domain only) + full pytest suite with coverage.
# Runs on push to main/develop, on PRs, and can be triggered manually.
on:
  push:
    branches: ["main", "develop"]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install uv
        run: pip install uv

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: ruff check

      - name: Mypy (domain only)
        run: mypy domain/src/tradex_domain

      - name: Pytest with coverage
        run: python -m pytest --cov=domain --cov=brokers --cov=trading --cov-report=term-missing -q
