name: quality-gate

# Quality gate: ruff lint + mypy (all packages) + full pytest suite with coverage.
# Runs on push to main/develop, on PRs, and can be triggered manually.
on:
  push:
    branches: ["main", "develop"]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # The 17 packages are a uv workspace whose manifests depend on each other
      # by name; plain `pip install -e ./domain -e ./brokers` cannot resolve a
      # sibling from this repo and dies looking for it on PyPI. See parity.yml.
      - name: Install uv
        run: pip install uv

      - name: Sync dependencies
        run: uv sync --frozen

      # Every tool below runs through `uv run --no-sync`. `uv sync` creates
      # .venv/ but does not put .venv/bin on PATH, so a bare `ruff`/`mypy`/
      # `python` here resolves to the setup-python interpreter, which has none
      # of them installed. --no-sync keeps the frozen lock authoritative instead
      # of letting `uv run` silently re-resolve.
      #
      # WARNING: this step currently FAILS. `ruff check` reports hundreds of
      # pre-existing violations of the E/F/W/I/UP set the root pyproject.toml
      # declares (measured: 437). It is left failing rather than suppressed —
      # see the ratchet proposal before touching it. Because it is a hard step,
      # the mypy and pytest steps below it are still unreachable on a runner.
      - name: Ruff lint
        run: uv run --no-sync ruff check

      - name: Mypy (domain)
        run: uv run --no-sync mypy domain/src/tradex_domain

      - name: Mypy (brokers)
        continue-on-error: true  # 10 errors, tracked typing debt
        run: uv run --no-sync mypy brokers/src/tradex_brokers

      - name: Mypy (config)
        continue-on-error: true  # now 0 errors; kept soft so the flag still means
                                 # "B3 typing debt is open repo-wide" — safe to drop
        run: uv run --no-sync mypy config/src/tradex_config

      - name: Mypy (execution)
        continue-on-error: true  # 4 errors, tracked typing debt (B3 goal)
        run: uv run --no-sync mypy execution/src/tradex_execution

      - name: Mypy (analytics)
        continue-on-error: true  # 1 error, tracked typing debt (B3 goal)
        run: uv run --no-sync mypy analytics/src/tradex_analytics

      - name: Mypy (strategy)
        continue-on-error: true  # 3 errors, tracked typing debt (B3 goal)
        run: uv run --no-sync mypy strategy/src/tradex_strategy

      - name: Mypy (interfaces)
        continue-on-error: true  # 6 errors, tracked typing debt (B3 goal)
        run: uv run --no-sync mypy interfaces/src/tradex_interfaces

      - name: Mypy (runtime)
        continue-on-error: true  # 10 errors, tracked typing debt (B3 goal)
        run: uv run --no-sync mypy runtime/src/tradex_runtime

      - name: Mypy (trading)
        continue-on-error: true  # 2 errors, tracked typing debt (PE-3)
        run: uv run --no-sync mypy trading/src/tradex_trading

      # Coverage names the 17 importable packages, not the 17 top-level
      # directories. The directory form (`--cov=trading`) matches no module and
      # coverage reported "No data to report" — so the step that looked like it
      # was measuring 9 packages was measuring none of them.
      #
      # Floor: 85. Measured on this tree: 88.2% (24374 statements, 2881 missed;
      # per-package range 79.7% tradex_trading to 100% in five packages). 85
      # leaves ~3 points — roughly 780 statements — of headroom for the
      # differences between this measurement and a runner's (CI is Python 3.12,
      # this venv is 3.13; platform-conditional tests skip differently), and
      # still fails on any regression larger than that. It is a floor, not a
      # target: raise it as coverage genuinely rises.
      - name: Pytest with coverage
        run: >-
          uv run --no-sync python -m pytest
          --cov=tradex_domain --cov=tradex_brokers --cov=tradex_config
          --cov=tradex_trading --cov=tradex_research --cov=tradex_operations
          --cov=tradex_observability --cov=tradex_analytics
          --cov=tradex_reactive --cov=tradex_execution --cov=tradex_strategy
          --cov=tradex_replay --cov=tradex_application
          --cov=tradex_market_data --cov=tradex_interfaces
          --cov=tradex_runtime --cov=tradex_persistence
          --cov-fail-under=85
          --cov-report=term-missing -q
