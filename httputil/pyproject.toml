[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tradex-http"
version = "0.1.0"
description = "TradeX shared HTTP primitives (constant-time API-key check)"
requires-python = ">=3.12"
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/tradex_http"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]
