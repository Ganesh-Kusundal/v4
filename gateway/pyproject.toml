[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tradex-gateway"
version = "0.1.0"
description = "TradeX dual-broker market-data gateway (history, quotes, depth, live feed)"
requires-python = ">=3.12"

dependencies = [
    "tradex-domain>=0.1.0,<0.2",
    "tradex-config>=0.1.0,<0.2",
    "tradex-brokers>=0.1.0,<0.2",
    "tradex-market-data>=0.1.0,<0.2",
    "tradex-runtime>=0.1.0,<0.2",
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1"]

[project.scripts]
tradex-gateway = "tradex_gateway.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tradex_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]
