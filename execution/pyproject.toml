[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tradex-execution"
version = "0.1.0"
description = "TradeX execution engine and OMS"
requires-python = ">=3.12"

dependencies = [
    "tradex-domain>=0.1.0,<0.2",
    "tradex-reactive>=0.1.0,<0.2",
    "tradex-observability>=0.1.0,<0.2",
    "rx>=3.2,<4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tradex_execution"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]
