[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tradex-brokers"
version = "0.1.0"
description = "TradeX v4 broker SDK — Dhan, Upstox, Paper adapters with auth, token lifecycle, rate limiting, circuit breaker, WebSocket streams"
requires-python = ">=3.12"
dependencies = [
    "tradex-domain>=0.1.0,<0.2",
    "rx>=7.0,<8",
]

[project.optional-dependencies]
dhan = ["Dhan-Tradehull>=3.3.1,<4"]
ws = ["websockets>=12.0,<16"]
full = ["Dhan-Tradehull>=3.3.1,<4", "websockets>=12.0,<16", "curl-cffi>=0.7.0,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/tradex_brokers"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
mypy_path = "../domain/src"
ignore_missing_imports = true
disable_error_code = ["no-any-return", "misc"]
