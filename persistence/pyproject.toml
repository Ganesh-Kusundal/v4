[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tradex-persistence"
version = "0.1.0"
description = "TradeX persistence — SQLite order/event stores"
requires-python = ">=3.12"
dependencies = [
    "tradex-execution>=0.1.0,<0.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tradex_persistence"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]
