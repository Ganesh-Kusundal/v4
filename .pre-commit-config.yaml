repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: import-boundaries
        name: package import boundaries
        entry: uv run --no-sync python -m pytest tests/test_import_boundaries.py -q
        language: system
        pass_filenames: false
        types: [python]
        stages: [pre-commit]

      - id: no-hardcoded-literals
        name: no hardcoded literals
        entry: grep -rn 'os.environ.get("TRADEX_' --include='*.py' domain/src/ config/src/ brokers/src/ execution/src/ replay/src/ strategy/src/ runtime/src/ interfaces/src/ analytics/src/ application/src/ services/ reactive/src/ observability/src/ persistence/src/ research/src/ operations/src/ | grep -v 'constants.py\|enums.py\|metrics.py' || true
        language: system
        pass_filenames: false
        types: [python]
        stages: [pre-commit]
