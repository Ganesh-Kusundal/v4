repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # The ratchet is only worth installing if it is free to run locally. Ruff is
  # the fast guard; the import-boundary test is the architectural one (it is
  # what keeps domain pure and the package graph acyclic) and still runs in a
  # couple of seconds, so it belongs in the pre-commit loop rather than only in
  # CI where a failure is expensive to discover.
  - repo: local
    hooks:
      - id: import-boundaries
        name: package import boundaries
        entry: uv run --no-sync python -m pytest tests/test_import_boundaries.py -q
        language: system
        pass_filenames: false
        types: [python]
        stages: [pre-commit]
      - id: hardcoded-literals
        name: hardcoded literal check
        entry: '.venv/bin/python -c ''import sys;bad=[f"{p}:{n}:{l.strip()}" for p in sys.argv[1:] for n,l in enumerate(open(p),1) if ("http://" in l or "https://" in l) or (any(k in l.lower() for k in ("token","secret","password","api_key","apikey","passwd")) and "=" in l and l.split("=",1)[1].lstrip()[:1] in (chr(34),chr(39)))];print(chr(10).join(bad)) if bad else None;sys.exit(1) if bad else None'''
        language: system
        types: [python]
        stages: [pre-commit]
