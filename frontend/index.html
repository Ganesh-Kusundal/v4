<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Rewritten at request time by the backend's GET / key-injection route
         (fastapi_app.py `_root_with_key`); stays empty on keyless servers. -->
    <meta name="api-key" content="" data-applied="false" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>TradeX</title>
  </head>
  <body>
    <div id="app">
      <section id="order-controls" class="order-controls" aria-label="Order safety controls">
        <span id="order-product" class="order-controls__badge">INTRADAY</span>
        <label class="order-controls__label" for="qty">Qty <input id="qty" type="number" min="1" step="1" value="1" /></label>
        <label class="order-controls__label"><input id="arm" type="checkbox" /> Arm trading</label>
        <span id="mode" class="order-controls__mode">MODE UNKNOWN · NOT READY</span>
        <span id="feed-status" class="order-controls__feed">Feed not ready</span>
        <span id="order-status" class="order-controls__status" role="status" aria-live="polite"></span>
        <span id="order-quote" class="order-controls__quote">LTP —</span>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
