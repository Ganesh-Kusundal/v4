<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="x-api-key" content="" data-applied="false" />
  <title>TradeX v4</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>◈</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* TradeX v4 — Clean Trading Terminal */

    :root {
      --bg: #020617;
      --surface: #0F172A;
      --surface-2: #1E293B;
      --fg: #F8FAFC;
      --muted: #94A3B8;
      --border: #334155;
      --bull: #22C55E;
      --bear: #EF4444;
    }
    * { box-sizing: border-box; }
    * { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 999px; }

    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: "Inter", system-ui, sans-serif;
      font-size: 13px; line-height: 1.4;
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: 40px 1fr;
      gap: 0; padding: 0;
      height: 100vh; overflow: hidden;
    }

    /* ── Shellbar ── */
    .shellbar {
      grid-column: 1 / -1;
      display: flex; align-items: center; gap: 8px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 12px; height: 40px;
    }
    .brand {
      font-weight: 600; font-size: 14px; color: var(--fg);
    }
    .sym-btn {
      height: 28px; padding: 0 10px;
      background: var(--surface-2); border: 1px solid var(--border); border-radius: 4px;
      color: var(--fg); font: 500 12px "Inter", system-ui, sans-serif; cursor: pointer;
    }
    .tf-pills {
      display: flex; gap: 0;
      border: 1px solid var(--border); border-radius: 4px; overflow: hidden;
    }
    .tf-pills button {
      height: 26px; padding: 0 10px;
      background: transparent; border: none; border-right: 1px solid var(--border);
      color: var(--muted); font: 500 11px "Inter", system-ui, sans-serif; cursor: pointer;
    }
    .tf-pills button:last-child { border-right: none; }
    .tf-pills button.is-on { background: var(--surface-2); color: var(--fg); }
    .qty-input {
      width: 56px; height: 26px; text-align: center;
      background: var(--surface-2); border: 1px solid var(--border); border-radius: 4px;
      color: var(--fg); font: 600 12px "Inter", system-ui, sans-serif;
      font-variant-numeric: tabular-nums;
    }
    .buy-btn, .sell-btn {
      height: 28px; padding: 0 14px; border-radius: 4px;
      font: 600 12px "Inter", system-ui, sans-serif; cursor: pointer;
      border: 1px solid transparent;
    }
    .buy-btn { color: var(--bull); border-color: rgba(34,197,94,0.3); }
    .sell-btn { color: var(--bear); border-color: rgba(239,68,68,0.3); }
    .buy-btn:hover { background: rgba(34,197,94,0.1); }
    .sell-btn:hover { background: rgba(239,68,68,0.1); }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
    .status-dot.on { background: var(--bull); }
    .status-text {
      font: 11px "Inter", system-ui, sans-serif; color: var(--muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-left: auto;
    }

    /* ── Chart Stage ── */
    #split { grid-column: 1; grid-row: 2; display: flex; min-height: 0; min-width: 0; }
    .stage { position: relative; flex: 1; min-height: 0; min-width: 0; background: #0a0e14; }
    #chart { position: absolute; inset: 0; }
    #chart canvas { position: absolute; top: 0; left: 0; width: 100% !important; height: 100% !important; }
    #legend {
      position: absolute; top: 8px; left: 8px; z-index: 5; pointer-events: none;
      display: inline-flex; align-items: baseline; gap: 8px;
      font: 11px "Inter", system-ui, sans-serif; font-variant-numeric: tabular-nums;
      color: var(--muted); background: transparent; border: none;
    }
    #legend:empty { display: none; }
    #legend .name { font-weight: 500; font-size: 11px; color: var(--fg); }
    #legend .meta { color: var(--muted); }

    /* Replay bar */
    #replaybar {
      position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%);
      z-index: 15; display: flex; align-items: center; gap: 8px; padding: 8px 12px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
    }
    #replaybar[hidden] { display: none; }
    #replaybar button {
      height: 24px; padding: 0 8px; border-radius: 4px; border: 1px solid var(--border);
      background: var(--surface-2); color: var(--muted); font: 500 11px "Inter", system-ui, sans-serif; cursor: pointer;
    }
    #replaybar button.is-on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
    #replaybar input[type=range] { width: 160px; accent-color: var(--muted); }
    #replaybar .rcount { font: 11px "Inter", system-ui, sans-serif; font-variant-numeric: tabular-nums; color: var(--fg); }
    #replaybar .rclock { font: 10px "Inter", system-ui, sans-serif; font-variant-numeric: tabular-nums; color: var(--muted); }

    /* ── Modals ── */
    #setmodal, #cmpmodal, #chartset {
      position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,0.6);
      display: flex; align-items: center; justify-content: center;
    }
    #setmodal[hidden], #cmpmodal[hidden], #chartset[hidden] { display: none; }
    .set-card {
      width: 380px; max-height: 80vh; display: flex; flex-direction: column;
      background: var(--surface); border: 1px solid var(--border); border-radius: 6px; overflow: hidden;
    }
    .set-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 14px; border-bottom: 1px solid var(--border);
      font: 600 13px "Inter", system-ui, sans-serif; color: var(--fg);
    }
    .set-head button { border: 0; background: transparent; color: var(--muted); font-size: 18px; cursor: pointer; }
    .set-body { padding: 14px 16px; overflow: auto; display: grid; gap: 4px; }
    .set-row { display: grid; grid-template-columns: 1fr 140px; align-items: center; gap: 10px; min-height: 30px; }
    .set-row label { font: 500 12px "Inter", system-ui, sans-serif; color: var(--muted); }
    .set-ctl input {
      height: 28px; background: var(--bg); border: 1px solid var(--border); border-radius: 4px;
      color: var(--fg); padding: 0 8px; font: 12px "Inter", system-ui, sans-serif; width: 100%;
    }
    .set-ctl input:focus { border-color: var(--muted); outline: none; }
    .set-foot { display: flex; justify-content: space-between; padding: 12px 16px; border-top: 1px solid var(--border); }
    .set-foot .btn {
      height: 28px; padding: 0 12px; border-radius: 4px;
      font: 600 12px "Inter", system-ui, sans-serif; cursor: pointer;
    }
    .set-foot .btn--ghost { background: var(--surface-2); border: 1px solid var(--border); color: var(--muted); }
    .set-foot .btn--primary { background: var(--fg); border: 1px solid var(--fg); color: var(--bg); }

    /* ── Overlays ── */
    .overlay {
      position: fixed; top: 40px; bottom: 0; z-index: 20;
      display: flex; flex-direction: column;
      background: var(--surface); border: 1px solid var(--border);
      transition: transform 0.2s ease;
    }
    .overlay--right { right: 0; width: 280px; transform: translateX(100%); }
    .overlay--left { left: 0; width: 44px; transform: translateX(-100%); }
    .overlay--bottom { left: 0; right: 0; bottom: 0; top: auto; height: 140px; transform: translateY(100%); }
    .overlay--right.open { transform: translateX(0); }
    .overlay--left.open { transform: translateX(0); }
    .overlay--bottom.open { transform: translateY(0); }

    /* ── Command Palette ── */
    .palette-backdrop {
      position: fixed; inset: 0; z-index: 30;
      background: rgba(0,0,0,0.5); display: flex; align-items: flex-start; justify-content: center; padding-top: 120px;
    }
    .palette-modal {
      width: 500px; max-height: 60vh; display: flex; flex-direction: column;
      background: var(--surface); border: 1px solid var(--border); border-radius: 6px; overflow: hidden;
    }
    .palette-input {
      height: 40px; padding: 0 12px; background: var(--bg); border: none; border-bottom: 1px solid var(--border);
      color: var(--fg); font: 13px "Inter", system-ui, sans-serif; outline: none;
    }
    .palette-results { flex: 1; overflow-y: auto; padding: 8px; }
    .palette-cat {
      font: 600 10px "Inter", system-ui, sans-serif; letter-spacing: .05em; text-transform: uppercase;
      color: var(--muted); padding: 8px 8px 4px;
    }
    .palette-row {
      width: 100%; text-align: left; padding: 8px; border: none; border-radius: 4px;
      background: transparent; color: var(--fg); font: 12px "Inter", system-ui, sans-serif; cursor: pointer;
    }
    .palette-row:hover { background: var(--surface-2); }
    .palette-empty { padding: 16px; text-align: center; color: var(--muted); font: 12px "Inter", system-ui, sans-serif; }

    /* ── Focus States ── */
    :focus-visible { outline: 2px solid #3B82F6; outline-offset: 2px; }

    /* ── Reduced Motion ── */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <header class="shellbar" id="shellbar">
    <span class="brand">TradeX</span>
    <button class="sym-btn" id="sym-btn">NSE:RELIANCE</button>
    <div class="tf-pills" id="tf-pills"></div>
    <input type="number" class="qty-input" id="qty-input" value="10" min="1" />
    <button class="buy-btn" id="buy-btn">BUY</button>
    <button class="sell-btn" id="sell-btn">SELL</button>
    <span class="status-dot" id="status-dot"></span>
    <span class="status-text" id="status-text">ready</span>
  </header>
  <div id="split">
    <main class="stage">
      <div id="chart"></div>
      <div id="legend"></div>
      <div id="replaybar" hidden></div>
    </main>
  </div>
  <div id="setmodal" hidden><div class="set-card"><div class="set-head"><span id="set-title"></span><button id="set-x">×</button></div><div id="set-body" class="set-body"></div><div class="set-foot"><button id="set-remove" class="btn btn--ghost">Remove</button><span style="margin-left:auto;display:flex;gap:8px"><button id="set-cancel" class="btn btn--ghost">Cancel</button><button id="set-ok" class="btn btn--primary">Apply</button></span></div></div></div>
  <div id="cmpmodal" hidden><div class="set-card"><div class="set-head"><span>Compare</span><button id="cmp-x">×</button></div><div class="set-body"><div class="set-row"><label>Symbol</label><div class="set-ctl"><input id="cmp-sym" placeholder="RELIANCE" /></div></div><div class="set-row"><label>Mode</label><div class="set-ctl"><select id="cmp-mode"><option value="percentage">Percent</option><option value="indexed-to-100">Indexed</option><option value="none">Own scale</option></select></div></div><div id="cmp-list" style="margin-top:10px"></div></div><div class="set-foot"><button id="cmp-close" class="btn btn--ghost">Close</button><button id="cmp-add" class="btn btn--primary">Add</button></div></div></div>
  <div id="chartset" hidden><div class="cset-card"><div class="set-head"><span>Chart Settings</span><button id="cset-x">×</button></div><div class="cset-main"><nav class="cset-tabs" id="cset-tabs"></nav><div id="cset-body" class="set-body"></div></div><div class="set-foot"><button id="cset-defaults" class="btn btn--ghost">Restore</button><button id="cset-cancel" class="btn btn--ghost">Cancel</button><button id="cset-ok" class="btn btn--primary">OK</button></div></div></div>
  <div id="axmenu" class="axmenu" hidden></div><div id="axsub" class="axmenu" hidden></div>
  <div id="toolwidget" hidden></div><div id="textmodal" hidden><div class="set-card td-card" id="textdlg"></div></div><div id="colorpop" hidden></div>
  <div id="ctxmenu" hidden>
    <button class="buy" data-side="BUY" data-type="MARKET">Buy Market</button>
    <button class="sell" data-side="SELL" data-type="MARKET">Sell Market</button>
    <hr><button class="buy" data-side="BUY" data-type="LIMIT">Buy Limit</button>
    <button class="sell" data-side="SELL" data-type="LIMIT">Sell Limit</button>
    <hr><button data-side="BUY" data-type="SL">Buy Stop</button><button data-side="SELL" data-type="SL">Sell Stop</button>
    <hr><button data-act="cancelall">Cancel All</button><hr>
    <button data-act="delsel">Delete Drawing</button><button data-act="delall">Clear Drawings</button>
    <hr><button data-act="copy">Copy</button><button data-act="cut">Cut</button><button data-act="paste">Paste</button>
    <hr><button data-act="indset">Indicator Settings</button><hr><button data-act="chartset">Chart Settings</button>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
