<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TradeX Terminal</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>" />
    <style>
      :root {
        --bg: #131722;
        --bg-raised: #1e222d;
        --border: #2a2e39;
        --text: #d1d4dc;
        --text-dim: #787b86;
        --accent: #2962ff;
        --green: #26a69a;
        --red: #ef5350;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.4 system-ui, -apple-system, sans-serif;
      }
      #app {
        display: grid;
        grid-template-rows: auto 1fr 280px;
        gap: 6px;
        height: 100vh;
        padding: 6px;
      }
      #toolbar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        background: var(--bg-raised);
        border: 1px solid var(--border);
        border-radius: 6px;
      }
      #chart-host {
        min-height: 0; /* let the chart row shrink inside the grid */
        position: relative;
      }
      #chart-host > * { width: 100%; height: 100%; }
      #panel-host.panel {
        overflow-y: auto;
        padding: 10px 12px;
        background: var(--bg-raised);
        border: 1px solid var(--border);
        border-radius: 6px;
      }
      .panel h3 {
        margin: 0 0 8px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text-dim);
      }
      .panel section {
        margin-bottom: 14px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
      }
      .panel label {
        color: var(--text-dim);
        font-size: 12px;
      }
      input[type="text"], input[type="number"], select {
        background: var(--bg);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 4px 8px;
        outline: none;
      }
      input:focus, select:focus { border-color: var(--accent); }
      button {
        background: var(--bg);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 4px 12px;
        cursor: pointer;
      }
      button:hover { border-color: var(--accent); color: #fff; }
      button:active { background: var(--accent); }
      .status { color: var(--text-dim); }
      .param-row { display: flex; gap: 6px; }
      .param-row input { width: 72px; }
      table.scanner-table { width: 100%; border-collapse: collapse; }
      table.scanner-table td { padding: 3px 0; }
      pre.scanner-results {
        margin: 6px 0 0;
        padding: 8px;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 4px;
        max-height: 160px;
        overflow: auto;
        white-space: pre;
        font-size: 12px;
        color: var(--text);
      }
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 5px;
      }
      ::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
