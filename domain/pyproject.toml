[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tradex-domain"
version = "0.1.0"
description = "TradeX v4 shared domain kernel — enums, value objects, instruments, protocols, capabilities, wire mapping, events"
requires-python = ">=3.12"
dependencies = ["rx>=3.2,<4"]

[tool.hatch.build.targets.wheel]
packages = ["src/tradex_domain"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disable_error_code = ["no-any-return", "unused-ignore"]
