# Root config so the whole v4 suite runs as one command.
[tool.pytest.ini_options]

addopts = "--import-mode=importlib --timeout=120"
testpaths = [
    "tests",
    "domain/tests",
    "brokers/tests",
    "trading/tests",
    "research/tests",
    "operations/tests",
    "observability/tests",
    "analytics/tests",
    "reactive/tests",
    "execution/tests",
    "strategy/tests",
    "replay/tests",
    "application/tests",
    "market_data/tests",
    "interfaces/tests",
    "runtime/tests",
    "persistence/tests",
    # These two suites existed and were green, but were absent from testpaths,
    # so `python -m pytest` at the root never collected them: 61 tests (7 in
    # config, 54 in duckdb-analytics) that no CI job and no local full run had
    # ever executed. Appended rather than inserted in member order because
    # config's own tests were the omission, not its package.
    "config/tests",
    "services/duckdb-analytics/tests",
]
# Editable installs own extracted packages; pythonpath keeps composition + shims.
pythonpath = [
    "config/src",
    "domain/src",
    "brokers/src",
    "research/src",
    "operations/src",
    "observability/src",
    "analytics/src",
    "reactive/src",
    "execution/src",
    "strategy/src",
    "replay/src",
    "application/src",
    "market_data/src",
    "interfaces/src",
    "runtime/src",
    "persistence/src",
    "services/duckdb-analytics/src",
    "brokers/tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
# One lint config for the repo, at the root. Without it, `ruff check` from the
# root resolved *no* ruff config in-tree and fell back to its defaults, so the
# lint gate ran a different rule set than the four packages carrying a
# [tool.ruff] block declared — and, on a machine with a config above the repo,
# ruff walked past the root entirely and used that instead. The number the lint
# gate produced was a property of the machine, not of the tree.
target-version = "py312"
line-length = 100
extend-exclude = [
    # Not shipped, not imported by any package, not part of any gate. Excluded
    # rather than fixed: scratch and benchmark trees, plus two generated trees
    # that are not source at all. Linting them yields noise nobody acts on.
    "poc",          # throwaway spikes
    "apps",         # scratch apps
    "benchmarks",   # benchmark harness
    "graphify-out", # generated knowledge graph
    ".kilo",        # agent worktrees — a full second copy of the tree
]

[tool.ruff.lint]
# C901 (cyclomatic complexity), PLR0912 (branch count) and PLR0915 (statement
# count) are the three rules that stop a god function forming. They are enabled
# at deliberately loose thresholds below, and that is worth stating plainly
# rather than hiding: a threshold tight enough to bite today fails on 1,322
# functions across 204 src/ files, which is a cleanup project rather than a
# safety property.
#
# The real gate is the COUNT, held by scripts/ruff_ratchet.py against
# .ruff_baseline. A loose threshold plus a ratchet means no new complex function
# can be added without failing the build, while the existing wall can only
# shrink. That is the same discipline remediation-and-hardening.md ratified for
# lint, applied to complexity. tests/test_complexity_gate.py holds the
# THRESHOLDS themselves, so a count-only ratchet cannot be satisfied by
# raising one of these.
select = ["E", "F", "W", "I", "UP", "C90", "PLR0912", "PLR0915"]

[tool.ruff.lint.mccabe]
# Current worst in src/ is ws_stream at 282 complexity
# (interfaces/src/tradex_interfaces/routes/stream.py:49); the next is 71.
max-complexity = 300

[tool.ruff.lint.pylint]
# Current worst in src/ is startup.boot at 39 branches
# (runtime/src/tradex_runtime/startup.py:368) — measured, and recorded here
# rather than left as a bare 300, because the number is what rots: a reader who
# assumes it is tight is wrong by 7x. The ceiling is the one spec 0002 lane 0d
# set and tests/test_complexity_gate.py holds; lowering it is always welcome.
max-branches = 300
# Current worst in src/ is ws_stream at 832 statements
# (interfaces/src/tradex_interfaces/routes/stream.py:49); the next is 250.
max-statements = 850

[tool.ruff.lint.per-file-ignores]
# Long tests are long scenarios. These three rules exist to stop a god function
# forming in production code; a 200-line websocket scenario is not that, and
# including tests would make the baseline about test style instead.
"**/tests/**" = ["C901", "PLR0912", "PLR0915"]
"**/test_*.py" = ["C901", "PLR0912", "PLR0915"]

[tool.mypy]
# Root mypy config. Its absence is why this gate was inert: mypy resolves
# config from the *current directory*, so a `mypy <pkg>/src/...` run from the
# repo root read no [tool.mypy] at all. The 17 per-package blocks were never
# consulted, and the run fell back to mypy's defaults — which report every
# cross-package import as `import-untyped` because no package ships py.typed.
#
# This mirrors the per-package intent (brokers/domain/trading/etc. keep their
# own blocks so each package is checkable standalone from its own directory).
python_version = "3.12"
ignore_missing_imports = true
disable_error_code = ["no-any-return", "misc"]

[[tool.mypy.overrides]]
# Checked-in protoc output (brokers/src/tradex_brokers/proto/MarketDataFeed_pb2.py,
# generated by protoc 6.33.x). Its CamelCase module name and its style are not
# ours to change, and the runtime requirement it implies is already declared in
# brokers/pyproject.toml.
module = ".*_pb2"
ignore_errors = true

[tool.uv.workspace]
members = [
    "domain",
    "brokers",
    "config",
    # "trading" was removed with the tradex_trading package: trading/ now holds
    # only tests/ and scripts/ (no installable src/), and its third-party runtime
    # deps moved onto the packages that actually import them (market_data).
    "research",
    "operations",
    "observability",
    "analytics",
    "reactive",
    "execution",
    "strategy",
    "replay",
    "application",
    "market_data",
    "interfaces",
    "runtime",
    "persistence",
    # Was a standalone project with its own uv.lock and .venv, invisible to the
    # root workspace: nothing installed it, so its 54 tests could not be part of
    # the root suite. It is now a member, so `uv sync` installs it (below) and its
    # declared deps resolve from the root lock instead of a second one.
    "services/duckdb-analytics",
]

[tool.uv.sources]
tradex-domain = { workspace = true }
tradex-brokers = { workspace = true }
tradex-config = { workspace = true }
# tradex-trading removed (package deleted; see the members comment above).
tradex-research = { workspace = true }
tradex-operations = { workspace = true }
tradex-observability = { workspace = true }
tradex-analytics = { workspace = true }
tradex-reactive = { workspace = true }
tradex-execution = { workspace = true }
tradex-strategy = { workspace = true }
tradex-replay = { workspace = true }
tradex-application = { workspace = true }
tradex-market-data = { workspace = true }
tradex-interfaces = { workspace = true }
tradex-runtime = { workspace = true }
tradex-persistence = { workspace = true }
tradex-duckdb = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.5,<1",
    "mypy>=1.10,<2",
    "pytest>=8,<10",
    "pytest-cov>=5,<7",
    "pytest-timeout>=2.3,<3",
    "hypothesis>=6.100,<7",
    "tradex-domain",
    "tradex-brokers[upstox]",
    "tradex-config",
    # tradex-trading[datalake,api,full] removed with the package; the deps its
    # extras carried (duckdb/pandas/pyarrow) now live on tradex-market-data, and
    # the API deps (fastapi/uvicorn/httpx/websockets) on tradex-interfaces.
    "tradex-research",
    "tradex-operations",
    "tradex-observability",
    "tradex-analytics",
    "tradex-reactive",
    "tradex-execution",
    "tradex-strategy",
    "tradex-replay",
    "tradex-application",
    "tradex-market-data",
    "tradex-interfaces",
    "tradex-runtime",
    "tradex-persistence",
    # Read-only DuckDB analytics service over the parquet datalake (MCP too).
    # In the dev group so `uv sync` installs it and services/duckdb-analytics/tests
    # is runnable from the root suite rather than only from its own directory.
    "tradex-duckdb",
]
