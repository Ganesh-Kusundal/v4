# Root config so the whole v4 suite runs as one command:
#   pytest domain/tests brokers/tests trading/tests
# Without this, the three sibling `tests/` dirs collide on the module id
# `tests.conftest` (no package __init__), raising ImportPathMismatchError.
# `importmode = "importlib"` names modules by path, not by an importable
# `tests` package, which removes the collision.
#
# Requires pytest-timeout (uv pip install pytest-timeout) for --timeout;
# without it pytest errors on the unknown flag. Hang-class failures (e.g.
# websocket waits) fail fast instead of blocking CI forever.
addopts = "--import-mode=importlib --timeout=120"
testpaths = ["tests", "domain/tests", "brokers/tests", "trading/tests"]
# `support` (shared broker test helpers) is importable because brokers/tests
# is on the path and the directory name `support` is unique across the repo.
pythonpath = ["domain/src", "brokers/src", "trading/src", "brokers/tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

# The repo-root pyproject.toml is a uv workspace manifest, not a Python
# package. The three sibling packages (domain, brokers, trading) are
# editable workspace members; their own pyproject.toml files declare
# runtime dependencies and optional extras.
[tool.uv.workspace]
members = ["domain", "brokers", "trading"]

[tool.uv.sources]
tradex-domain = { workspace = true }
tradex-brokers = { workspace = true }
tradex-trading = { workspace = true }

[dependency-groups]
# Dev tooling consumed by `uv sync` and the CI quality-gate workflow.
# Each sibling package (`domain/`, `brokers/`, `trading/`) declares its
# own runtime dependencies in its own pyproject.toml; this list is the
# minimum the quality-gate workflow needs (ruff lint, mypy on the domain
# kernel, pytest + coverage + timeout across all three packages).
dev = [
    "ruff>=0.5,<1",
    "mypy>=1.10,<2",
    "pytest>=8,<10",
    "pytest-cov>=5,<7",
    "pytest-timeout>=2.3,<3",
    "tradex-domain",
    "tradex-brokers",
    "tradex-trading",
]
