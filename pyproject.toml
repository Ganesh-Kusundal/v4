# Root config so the whole v4 suite runs as one command.
[tool.pytest.ini_options]

addopts = "--import-mode=importlib --timeout=120"
testpaths = [
    "tests",
    "domain/tests",
    "brokers/tests",
    "trading/tests",
    "research/tests",
    "operations/tests",
    "observability/tests",
    "analytics/tests",
    "reactive/tests",
    "execution/tests",
    "strategy/tests",
    "replay/tests",
    "application/tests",
    "market_data/tests",
    "interfaces/tests",
    "runtime/tests",
    "persistence/tests",
]
# Editable installs own extracted packages; pythonpath keeps composition + shims.
pythonpath = [
    "config/src",
    "domain/src",
    "brokers/src",
    "trading/src",
    "research/src",
    "operations/src",
    "observability/src",
    "analytics/src",
    "reactive/src",
    "execution/src",
    "strategy/src",
    "replay/src",
    "application/src",
    "market_data/src",
    "interfaces/src",
    "runtime/src",
    "persistence/src",
    "brokers/tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.uv.workspace]
members = [
    "domain",
    "brokers",
    "config",
    "trading",
    "research",
    "operations",
    "observability",
    "analytics",
    "reactive",
    "execution",
    "strategy",
    "replay",
    "application",
    "market_data",
    "interfaces",
    "runtime",
    "persistence",
]

[tool.uv.sources]
tradex-domain = { workspace = true }
tradex-brokers = { workspace = true }
tradex-config = { workspace = true }
tradex-trading = { workspace = true }
tradex-research = { workspace = true }
tradex-operations = { workspace = true }
tradex-observability = { workspace = true }
tradex-analytics = { workspace = true }
tradex-reactive = { workspace = true }
tradex-execution = { workspace = true }
tradex-strategy = { workspace = true }
tradex-replay = { workspace = true }
tradex-application = { workspace = true }
tradex-market-data = { workspace = true }
tradex-interfaces = { workspace = true }
tradex-runtime = { workspace = true }
tradex-persistence = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.5,<1",
    "mypy>=1.10,<2",
    "pytest>=8,<10",
    "pytest-cov>=5,<7",
    "pytest-timeout>=2.3,<3",
    "hypothesis>=6.100,<7",
    "tradex-domain",
    "tradex-brokers[upstox]",
    "tradex-config",
    "tradex-trading[datalake,api,full]",
    "tradex-research",
    "tradex-operations",
    "tradex-observability",
    "tradex-analytics",
    "tradex-reactive",
    "tradex-execution",
    "tradex-strategy",
    "tradex-replay",
    "tradex-application",
    "tradex-market-data",
    "tradex-interfaces",
    "tradex-runtime",
    "tradex-persistence",
]
