[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tradex-strategy"
version = "0.1.0"
description = "TradeX strategy runtime, artifacts, and extensions"
requires-python = ">=3.12"

dependencies = [
    "tradex-domain>=0.1.0,<0.2",
    "tradex-analytics>=0.1.0,<0.2",
    "tradex-market-data>=0.1.0,<0.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tradex_strategy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]
