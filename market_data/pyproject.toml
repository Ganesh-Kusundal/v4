[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tradex-market-data"
version = "0.1.0"
description = "TradeX market data — datalake and feed storage"
requires-python = ">=3.12"

dependencies = [
    "tradex-domain>=0.1.0,<0.2",
    # ``tradex-brokers`` was removed (REF-16): nothing under market_data/src
    # (or its tests) imports tradex_brokers — verified by grep.
    # The datalake is a real runtime dependency, not an optional extra: the
    # Parquet store, sync, gap and provider paths import these at module level.
    # They used to arrive only through the removed tradex-trading[datalake]
    # extra, so this package was un-installable on its own.
    "duckdb>=0.10,<2",
    "pandas>=2,<3",
    "pyarrow>=14,<20",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tradex_market_data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]
