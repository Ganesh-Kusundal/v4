[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tradex-operations"
version = "0.1.0"
description = "TradeX operations — runbook and metrics catalog index"
requires-python = ">=3.12"
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/tradex_operations"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]
